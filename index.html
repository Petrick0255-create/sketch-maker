<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Sketch Maker</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="stylesheet" href="style.css?v=7"><link rel="stylesheet" href="extra.css?v=12"></head><body>
  <main class="shell">
    <header><div><p class="eyebrow">J&B LAB</p><h1>Science Sketch Maker</h1></div><button id="apiBtn" class="ghost">API 키 설정</button></header>
    <section class="workspace">
      <div class="panel controls">
        <label>그리고 싶은 것<textarea id="script" maxlength="800" placeholder="예: 물음표 / 활활 타는 불꽃 / 수염이 아주 많이 난 사람이 생각에 잠긴 모습"></textarea></label>
        <label>프로젝트 폴더<input id="projectName" maxlength="80" placeholder="예: 0920 새 영상 제목"></label>
        <label>저장할 파일 이름<input id="outputName" maxlength="100" placeholder="예: 01 불이 붙은 양초"></label>
        <label>영상에 넣을 글자<input id="captionInput" maxlength="120" placeholder="한글로 입력하면 영상에는 영어로 표시됩니다 (비워도 됨)"></label>
        <label>그리기 효과<select id="drawEffect"><option value="classic" selected>기존 효과 · 연결된 선</option><option value="dots">도트 · 점을 찍으며 그리기</option><option value="pencil">연필 선 · 거친 획으로 그리기</option></select></label>
        <div class="row triple"><label>영상 길이<select id="duration"><option value="3">3초</option><option value="5" selected>5초</option><option value="10">10초</option><option value="15">15초</option><option value="20">20초</option><option value="30">30초</option></select></label><label>그리기 시작<select id="direction"><option value="top">위에서</option><option value="bottom">아래에서</option><option value="left">왼쪽에서</option><option value="right">오른쪽에서</option><option value="center">중앙에서부터</option></select></label><label>음성<select id="voice"><option value="none">없음</option><option value="Kore">차분한 음성</option><option value="Puck">밝은 음성</option></select></label></div>
        <div class="row captionControls"><label>글자 위치<select id="captionPosition"><option value="bottom">하단</option><option value="top">상단</option><option value="middle">중앙</option></select></label><label>글자 굵기<select id="captionWeight"><option value="300">1단계 · 매우 얇게</option><option value="400" selected>2단계 · 얇게</option><option value="500">3단계 · 보통</option><option value="600">4단계 · 굵게</option><option value="800">5단계 · 매우 굵게</option></select></label><label>글자 크기<select id="captionSize"><option value="14">1단계 · 작게</option><option value="16">2단계</option><option value="18" selected>3단계 · 보통</option><option value="22">4단계</option><option value="27">5단계 · 크게</option></select></label><label>글자 등장<select id="captionTiming"><option value="early">초반</option><option value="middle">중반</option><option value="late" selected>후반</option></select></label></div>
        <div class="row outputControls"><label>저장 형식<select id="videoFormat"><option value="mp4" selected>MP4 · 기본</option><option value="webm">WebM · 호환용</option></select></label><label>해상도<select id="resolution"><option value="720">720 × 1280</option><option value="1080" selected>1080 × 1920 · 인스타 권장</option><option value="2160">2160 × 3840 · 4K</option></select></label></div>
        <div class="makeActions"><button id="makeBtn" class="primary">영상 만들기</button><button id="regenerateBtn" class="secondary" disabled>그림만 다시 생성</button></div>
        <div id="status" class="status">입력한 대상을 흑백 손그림으로 생성합니다.</div>
      </div>
      <div class="panel previewPanel">
        <div class="phone"><canvas id="canvas" width="406" height="720"></canvas><button id="playBtn" class="play" aria-label="재생">▶</button></div>
        <div class="actions"><button id="previewBtn" class="secondary" disabled>미리보기</button><button id="downloadBtn" class="primary" disabled>영상 다운로드</button></div>
        <p class="hint">API 키는 이 브라우저에만 저장됩니다. GitHub 코드에는 포함되지 않습니다.</p>
      </div>
    </section>
  </main>
  <dialog id="apiDialog"><form method="dialog"><h2>Gemini API 키</h2><p>Google AI Studio에서 발급한 키를 입력하세요.</p><input id="apiKey" type="password" autocomplete="off" placeholder="AIza…"><div class="dialogActions"><button value="cancel" class="ghost">취소</button><button id="saveApi" value="default" class="primary">저장</button></div></form></dialog>
  <script src="app-v4.js?v=13"></script><script src="edge-v5.js?v=12"></script><script src="direction-v6.js?v=12"></script><script src="draw-effects-v11.js?v=13"></script><script src="caption-v7.js?v=13"></script><script src="caption-motion-v8.js?v=12"></script><script src="export-v9.js?v=12"></script>
</body></html>
